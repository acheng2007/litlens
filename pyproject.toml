[project]
name = "litlens"
version = "0.1.0"
description = "Local-first research RAG assistant for arXiv papers and PDFs"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "pydantic-settings>=2.6,<3", "sqlalchemy>=2.0,<3", "alembic>=1.14,<2", "typer>=0.15,<1", "httpx>=0.27,<1", "python-multipart>=0.0.9,<1"]
[project.optional-dependencies]
pdf = ["PyMuPDF>=1.24,<2"]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "ruff>=0.8,<1"]
[project.scripts]
litlens = "litlens.cli:app"
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
