[project]
name = "litlens"
version = "0.1.0"
description = "Local-first research RAG assistant for arXiv papers and PDFs"
requires-python = ">=3.11"
dependencies = ["langgraph>=1.2,<2", "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "pydantic-settings>=2.6,<3", "sqlalchemy>=2.0,<3", "alembic>=1.14,<2", "typer>=0.15,<1", "httpx>=0.27,<1", "python-multipart>=0.0.18,<1", "PyMuPDF>=1.24,<2", "psycopg[binary]>=3.2,<4", "pgvector>=0.3,<1", "redis>=5,<7", "defusedxml>=0.7,<1"]
[project.optional-dependencies]
pdf = ["PyMuPDF>=1.24,<2"]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "ruff>=0.8,<1", "respx>=0.22,<1"]
[project.scripts]
litlens = "litlens.cli:app"
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["litlens*"]

[tool.setuptools.package-data]
litlens = ["evaluation/*.json"]
