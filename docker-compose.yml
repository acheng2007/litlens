services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: litlens
      POSTGRES_USER: litlens
      POSTGRES_PASSWORD: litlens
    ports: ["5432:5432"]
    volumes: ["litlens_pgdata:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  api:
    build: .
    env_file: .env
    depends_on: [postgres, redis]
    ports: ["8000:8000"]
    command: uvicorn litlens.main:app --host 0.0.0.0 --port 8000
volumes:
  litlens_pgdata:

